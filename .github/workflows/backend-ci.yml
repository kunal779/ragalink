name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:17-3.6
        env:
          POSTGRES_DB: ragalink
          POSTGRES_USER: ragalink_local
          POSTGRES_PASSWORD: ragalink_local_dev_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragalink_local -d ragalink"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7.4-alpine
        env:
          REDIS_PASSWORD: ragalink_local_dev_password
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli -a ragalink_local_dev_password ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_DB: ragalink
      POSTGRES_USER: ragalink_local
      POSTGRES_PASSWORD: ragalink_local_dev_password
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_PASSWORD: ragalink_local_dev_password
      ENVIRONMENT: local

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy app

      - name: Alembic upgrade
        run: python -m alembic upgrade head

      - name: Pytest
        run: python -m pytest -q
